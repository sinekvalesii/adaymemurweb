name: KPSS tercih verisi
on:
  workflow_dispatch:
  schedule: [{ cron: "17 5 * * *" }]
permissions: { contents: write }
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pdfplumber
      - run: python tercih/olustur.py site/tercih.json
      - name: Değiştiyse kaydet
        run: |
          git config user.name "selcukyus-bot"; git config user.email "selcukyuss@users.noreply.github.com"
          git add site/tercih.json
          git diff --cached --quiet || (git commit -m "KPSS tercih verisi güncellendi" && git push)
